[project]
name = "Softwareagent"
version = "0.1.0"
description = "This project mainly focus on multi level agent to rigth code for api and db"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.137.1",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-core>=1.5.0",
    "langchain-groq>=1.1.3",
    "prompt-toolkit>=3.0.50",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pygithub>=2.9.1",
    "pyjwt>=2.13.0",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
software-agent = "app.cli.main:main"
ant-man-code = "app.cli.main:main"
ant-man = "app.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
