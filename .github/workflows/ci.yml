name: FastAPI CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest
      env:
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DB_URL: ${{ secrets.DB_URL }}
        GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
