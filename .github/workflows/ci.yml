name: Software_Agent CI

on:
  push:
    branches:
      - Agent
  pull_request:
    branches:
      - Agent

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: software_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d software_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/software_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Check Alembic
        run: uv run alembic history

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -q